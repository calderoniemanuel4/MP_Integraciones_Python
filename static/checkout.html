<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Checkout de prueba con Mercado Pago">
    <title>Checkout Pro</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18201f;
        background: #f2f5f4;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: #f2f5f4;
      }

      button { font: inherit; }

      .site-header {
        width: min(100% - 40px, 1180px);
        min-height: 76px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        margin: 0;
        color: #18201f;
        font-size: .82rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .wordmark::before {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #ee765f;
        box-shadow: 9px 0 0 #172d2a;
        content: "";
      }

      .environment {
        margin: 0;
        color: #697573;
        font-size: .78rem;
        font-weight: 700;
      }

      main {
        width: min(100% - 40px, 1180px);
        min-height: min(720px, calc(100vh - 112px));
        margin: 0 auto 36px;
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(360px, .75fr);
        overflow: hidden;
        border: 1px solid #d9e0de;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(27 46 43 / 10%);
      }

      .product-visual {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        background: #e8eceb;
      }

      .product-visual img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
      }

      .image-caption {
        position: absolute;
        right: 24px;
        bottom: 24px;
        margin: 0;
        padding: 9px 12px;
        border: 1px solid rgb(255 255 255 / 62%);
        border-radius: 4px;
        background: rgb(255 255 255 / 88%);
        color: #33413f;
        font-size: .76rem;
        font-weight: 750;
        backdrop-filter: blur(8px);
      }

      .checkout-panel {
        display: flex;
        flex-direction: column;
        padding: clamp(34px, 5vw, 68px);
        border-left: 1px solid #e3e8e6;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #c65342;
        font-size: .76rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      h1 {
        max-width: 420px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.2rem, 4vw, 3.55rem);
        font-weight: 500;
        line-height: 1.02;
      }

      .description {
        max-width: 420px;
        margin: 20px 0 34px;
        color: #65706e;
        font-size: .98rem;
        line-height: 1.65;
      }

      .unit-price {
        margin: 0 0 30px;
        color: #18201f;
        font-size: 1.42rem;
        font-weight: 800;
      }

      .unit-price small {
        margin-left: 8px;
        color: #7b8583;
        font-size: .74rem;
        font-weight: 650;
      }

      .field {
        display: grid;
        grid-template-columns: 1fr 104px;
        align-items: center;
        gap: 20px;
        margin-bottom: 28px;
      }

      #quantity-label {
        font-size: .87rem;
        font-weight: 800;
      }

      .quantity-control {
        width: 100%;
        min-height: 46px;
        display: grid;
        grid-template-columns: 36px 1fr 36px;
        align-items: stretch;
        border: 1px solid #aeb9b6;
        border-radius: 4px;
        background: #fff;
        overflow: hidden;
      }

      .quantity-control button {
        border: 0;
        color: #18201f;
        background: #eef2f1;
        cursor: pointer;
        font-size: 1.15rem;
        font-weight: 800;
      }

      .quantity-control button:hover:not(:disabled) { background: #dfe7e5; }

      .quantity-control button:disabled {
        color: #aeb7b5;
        cursor: not-allowed;
      }

      .quantity-control output {
        display: grid;
        place-items: center;
        color: inherit;
        font-weight: 750;
        text-align: center;
      }

      .quantity-control:focus-within {
        outline: 3px solid rgb(0 158 227 / 18%);
        border-color: #009ee3;
      }

      .total {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        margin: 0 0 24px;
        padding: 22px 0;
        border-top: 1px solid #e3e8e6;
        color: #55615f;
        font-size: .9rem;
      }

      .total strong {
        color: #18201f;
        font-size: 1.35rem;
      }

      .wallet-shell {
        width: 100%;
        min-height: 72px;
        position: relative;
      }

      #walletBrick_container {
        width: 100%;
        min-height: 48px;
      }

      .wallet-shell:not(.ready) #walletBrick_container { display: none; }

      .wallet-loading {
        width: 100%;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: #e7ebea;
        color: #5d6967;
        font-size: .82rem;
        font-weight: 700;
        text-align: center;
      }

      .wallet-shell.ready .wallet-loading { display: none; }

      #status {
        min-height: 21px;
        margin: 8px 0 0;
        color: #5d6967;
        font-size: .8rem;
        text-align: center;
      }

      #status.error { color: #a23535; }

      @media (max-width: 820px) {
        .site-header,
        main { width: min(100% - 24px, 620px); }

        .site-header { min-height: 64px; }

        main {
          min-height: 0;
          grid-template-columns: 1fr;
        }

        .product-visual {
          min-height: 0;
          aspect-ratio: 16 / 10;
        }

        .checkout-panel {
          padding: 34px 28px 30px;
          border-top: 1px solid #e3e8e6;
          border-left: 0;
        }

        h1 { font-size: clamp(2.15rem, 10vw, 3rem); }
        .description { margin-bottom: 24px; }
      }

      @media (max-width: 440px) {
        .environment { display: none; }
        .image-caption { right: 14px; bottom: 14px; }
        .checkout-panel { padding: 30px 22px 26px; }
        .field { grid-template-columns: 1fr 92px; }
      }

    </style>
  </head>
  <body>
    <header class="site-header">
      <p class="wordmark">Tienda demo</p>
      <p class="environment">Checkout Pro · Mercado Pago</p>
    </header>
    <main>
      <section class="product-visual" aria-label="Vista del producto">
        <img src="/static/product-speaker.jpg" alt="Parlante compacto blanco con frente de tela negra">
        <p class="image-caption">Edición demo · Blanco mate</p>
      </section>
      <section class="checkout-panel">
        <p class="eyebrow">Comercio electrónico móvil</p>
        <h1>Tienda Móvil</h1>
        <p class="description">Dispositivo de tienda móvil de comercio electrónico</p>
        <p class="unit-price">ARS 1.500,00 <small>por unidad</small></p>
        <div class="field">
          <span id="quantity-label">Cantidad</span>
          <div class="quantity-control" role="group" aria-labelledby="quantity-label">
            <button id="decrease-quantity" type="button" aria-label="Disminuir cantidad" disabled>&minus;</button>
            <output id="quantity" aria-live="polite">1</output>
            <button id="increase-quantity" type="button" aria-label="Aumentar cantidad">+</button>
          </div>
        </div>
        <p class="total"><span>Total</span><strong id="total">ARS 1.500,00</strong></p>
        <div class="wallet-shell" id="wallet-shell" aria-busy="true">
          <div class="wallet-loading">Preparando Mercado Pago...</div>
          <div id="walletBrick_container"></div>
          <p id="status" role="status"></p>
        </div>
      </section>
    </main>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="/static/checkout.js?v=quantity-stepper-1"></script>
  </body>
</html>
