<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Checkout de prueba con Mercado Pago">
    <title>Checkout Pro</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, sans-serif;
        color: #17212b;
        background: #eef2f5;
      }

      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 460px); padding: 32px; background: white; border: 1px solid #d8e0e7; border-radius: 8px; box-shadow: 0 18px 44px rgb(28 48 64 / 10%); }
      .brand { margin: 0 0 28px; color: #0878b9; font-size: .8rem; font-weight: 800; text-transform: uppercase; }
      h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; }
      .description { margin: 8px 0 28px; color: #5b6874; }
      .field { display: grid; gap: 8px; margin-bottom: 24px; }
      label { font-size: .88rem; font-weight: 700; }
      input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid #aebbc5; border-radius: 4px; color: inherit; background: white; font: inherit; }
      input:focus { outline: 3px solid rgb(0 158 227 / 20%); border-color: #009ee3; }
      .total { display: flex; justify-content: space-between; gap: 20px; margin: 0 0 24px; padding-block: 18px; border-block: 1px solid #e1e7ec; }
      .total strong { font-size: 1.15rem; }
      button { width: 100%; min-height: 48px; border: 0; border-radius: 4px; background: #009ee3; color: white; font: inherit; font-weight: 800; cursor: pointer; }
      button:hover { background: #0787c7; }
      button:focus-visible { outline: 3px solid rgb(0 97 153 / 30%); outline-offset: 3px; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 24px; margin: 16px 0 0; color: #53616d; font-size: .9rem; text-align: center; }
      #status.error { color: #a23535; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Mercado Pago Checkout Pro</p>
      <h1>Producto de prueba</h1>
      <p class="description">Integración de prueba procesada por la API FastAPI.</p>
      <div class="field">
        <label for="quantity">Cantidad</label>
        <input id="quantity" type="number" value="1" min="1" max="10" inputmode="numeric">
      </div>
      <p class="total"><span>Total</span><strong id="total">ARS 1.500,00</strong></p>
      <button id="pay">Pagar con Mercado Pago</button>
      <p id="status" role="status"></p>
    </main>
    <script>
      const API_BASE_URL = window.location.origin;
      const UNIT_PRICE = 1500;
      const button = document.querySelector("#pay");
      const quantityInput = document.querySelector("#quantity");
      const totalEl = document.querySelector("#total");
      const statusEl = document.querySelector("#status");
      const currencyFormatter = new Intl.NumberFormat("es-AR", {
        style: "currency",
        currency: "ARS"
      });

      function selectedQuantity() {
        const quantity = Number.parseInt(quantityInput.value, 10);
        return Math.min(10, Math.max(1, Number.isNaN(quantity) ? 1 : quantity));
      }

      function updateTotal() {
        const quantity = selectedQuantity();
        quantityInput.value = quantity;
        totalEl.textContent = currencyFormatter.format(UNIT_PRICE * quantity);
      }

      quantityInput.addEventListener("change", updateTotal);

      button.addEventListener("click", async () => {
        updateTotal();
        button.disabled = true;
        quantityInput.disabled = true;
        statusEl.className = "";
        statusEl.textContent = "Creando preferencia...";
        try {
          const response = await fetch(`${API_BASE_URL}/checkout/preference`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ product_code: "test-product", quantity: selectedQuantity() })
          });
          if (!response.ok) {
            throw new Error(`Error ${response.status}`);
          }
          const data = await response.json();
          statusEl.textContent = "Redirigiendo a Mercado Pago...";
          window.location.assign(data.checkout_url);
        } catch (error) {
          statusEl.className = "error";
          statusEl.textContent = "No se pudo iniciar el pago. Verificá la configuración de la API.";
          button.disabled = false;
          quantityInput.disabled = false;
        }
      });
    </script>
  </body>
</html>
